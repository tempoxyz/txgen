# Simple block generation example
# Generates blocks filled with transfer transactions.
#
# Usage:
#   txgen generate -s examples/blocks-simple.yaml -c ethereum -n 10

chain_id: 1
mode: blocks

accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 10]

templates:
  transfer:
    type: eip1559
    from:
      pool: users
      select: random
    to: "0x0000000000000000000000000000000000000001"
    value: 1000
    gas_limit: 21000
    max_fee_per_gas: 1000000000
    max_priority_fee_per_gas: 1000000000

mix:
  - template: transfer
    weight: 100

block_templates:
  standard:
    txs:
      - template: transfer
        count: 150
    engine:
      gas_limit: 30000000
      timestamp: increment

block_mix:
  - template: standard
    weight: 100
