# TIP20 workload with dependent transaction sequences.
#
# This mixes standalone TIP20 transfers with a two-step sequence:
#   1. owner approves spender
#   2. spender calls transferFrom(owner, recipient, amount)
#
# The second step depends on the first step's allowance state, so both steps
# share a sequence inclusion key and bench waits for the approve receipt before
# submitting transferFrom.
#
# With the weights below, workload item selection is 50/50. Because a sequence
# emits two transactions, `txgen generate -n 100` will produce roughly:
#   - 1/3 standalone transfer txs
#   - 2/3 sequence txs, i.e. approve + transferFrom pairs
#
# If you want a 50/50 split by emitted transaction count instead, use weights:
#   - template: 2
#   - sequence: 1

chain_id: 1337

# Default gas settings for this local Tempo/TIP20 workload.
gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000

accounts:
  # Owners hold tokens and approve spenders.
  owners:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 10]
  # Spenders submit transferFrom after approval.
  spenders:
    mnemonic: "test test test test test test test test test test test junk"
    range: [10, 20]

artifacts:
  # ERC-20 ABI used by transfer, approve, and transferFrom calls.
  ERC20: erc20.abi.json

templates:
  # Standalone TIP20 transfer used directly by the mix.
  tip20_transfer:
    type: tempo
    from:
      pool: owners
      select: random
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      to: "0x20c0000000000000000000000000000000000000"  # TIP20 predeploy.
      abi: ERC20
      function: transfer
      args:
        - "0x000000000000000000000000000000000000dEaD"
        - 1

  # Approval template. The sequence step fills in from/spender/amount.
  tip20_approve:
    type: tempo
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      to: "0x20c0000000000000000000000000000000000000"  # TIP20 predeploy.
      abi: ERC20
      function: approve
      args: []

  # transferFrom template. The sequence step fills in from/owner/recipient/amount.
  tip20_transfer_from:
    type: tempo
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      to: "0x20c0000000000000000000000000000000000000"  # TIP20 predeploy.
      abi: ERC20
      function: transferFrom
      args: []

sequences:
  # Approve once, then spend the approved allowance in the next step.
  approve_then_transfer_from:
    bindings:
      owner:
        account:
          pool: owners
          select: random
      spender:
        account:
          pool: spenders
          select: random
      recipient:
        address:
          const: "0x000000000000000000000000000000000000dEaD"
      approval_amount:
        u256: 1000000
      transfer_amount:
        u256: 1
    steps:
      - name: approve
        template: tip20_approve
        with:
          from: { var: owner.ref }
          call:
            args:
              - { var: spender.address }
              - { var: approval_amount }
      - name: transfer_from
        template: tip20_transfer_from
        with:
          from: { var: spender.ref }
          call:
            args:
              - { var: owner.address }
              - { var: recipient }
              - { var: transfer_amount }

mix:
  # Half of workload items are standalone transfers; half are two-step sequences.
  - template: tip20_transfer
    weight: 50
  - sequence: approve_then_transfer_from
    weight: 50
