# TIP20 + MPP workload.
#
# This emits roughly 50% standalone TIP20 transfers and 50% MPP channel
# transactions by emitted transaction count. The MPP workload item is a
# two-transaction sequence (open, then close), so the mix uses weights 2:1:
#   - transfer template emits 1 tx
#   - open_then_close sequence emits 2 txs
#
# The close step cannot be submitted before the open is included. txgen gives
# both sequence steps the same inclusion key, so bench waits for the open
# receipt before submitting the close.
#
# The channel id is deterministic and precomputed as:
#   keccak256(abi.encode(payer, payee, token, salt, authorizedSigner, channel, chainId))
# matching Tempo's MPP channel contract.
#
# Replace the channel binding below with your deployed TempoStreamChannel
# contract address. Payers also need to approve that contract to spend the TIP20
# token before running this workload, because the open step deposits 1 token.

chain_id: 1337

gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000

accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 20]

artifacts:
  ERC20: erc20.abi.json
  MPPChannel: mpp-channel.abi.json

templates:
  # Standalone TIP20 transfer.
  tip20_transfer:
    type: tempo
    from:
      pool: users
      select: random
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      to: "0x20c0000000000000000000000000000000000000" # TIP20 predeploy.
      abi: ERC20
      function: transfer
      args:
        - "0x000000000000000000000000000000000000dEaD"
        - 1

  # MPP open. The sequence fills in from/payee/token/salt/authorizedSigner.
  mpp_open:
    type: tempo
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      abi: MPPChannel
      function: open
      args: []

  # MPP close. The sequence fills in from/channelId.
  mpp_close:
    type: tempo
    gas_limit: 1000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      abi: MPPChannel
      function: close
      args: []

sequences:
  mpp_open_then_close:
    bindings:
      payer:
        account:
          pool: users
          select: random
      # The benchmark close path uses payer == payee, so close succeeds with an
      # empty signature and cumulativeAmount = 0.
      token:
        address:
          const: "0x20c0000000000000000000000000000000000000"
      channel:
        # Replace with the deployed TempoStreamChannel contract address.
        address:
          const: "0x0000000000000000000000000000000000000000"
      authorized_signer:
        address:
          const: "0x0000000000000000000000000000000000000000"
      salt:
        bytes32:
          random_bytes: 32
      channel_id:
        abi_hash:
          types: [address, address, address, bytes32, address, address, uint256]
          values:
            - { var: payer.address }       # payer / msg.sender
            - { var: payer.address }       # payee
            - { var: token }
            - { var: salt }
            - { var: authorized_signer }
            - { var: channel }
            - { var: chain_id }
    steps:
      - name: open
        template: mpp_open
        with:
          from: { var: payer.ref }
          call:
            to: { var: channel }
            args:
              - { var: payer.address }     # payee
              - { var: token }
              - 1                          # deposit
              - { var: salt }
              - { var: authorized_signer }
      - name: close
        template: mpp_close
        with:
          from: { var: payer.ref }
          call:
            to: { var: channel }
            args:
              - { var: channel_id }
              - 0                          # cumulativeAmount
              - "0x"                       # signature

mix:
  # 2:1 by workload item gives roughly 1 standalone transfer for every 2 MPP
  # sequence transactions, i.e. 50/50 by emitted transaction count.
  - template: tip20_transfer
    weight: 2
  - sequence: mpp_open_then_close
    weight: 1
