name: Build Docker image

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io/tempoxyz

jobs:
  build-and-push:
    name: build and push docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: shortsha
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: echo "shortsha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: tempoxyz/gh-actions/vendor/docker/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/txgen:${{ steps.shortsha.outputs.shortsha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/txgen:latest', env.REGISTRY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=full
