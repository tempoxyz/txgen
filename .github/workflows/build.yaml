name: Build Docker image

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io/tempoxyz

jobs:
  build-and-push:
    name: build and push docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - id: shortsha
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: echo "shortsha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/txgen:${{ steps.shortsha.outputs.shortsha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/txgen:latest', env.REGISTRY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=full
