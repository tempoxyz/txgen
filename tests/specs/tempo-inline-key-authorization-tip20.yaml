chain_id: 1337

gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000

accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 3]

artifacts:
  ERC20: ../../examples/erc20.abi.json

templates:
  inline_key_authorization_tip20_transfer:
    type: tempo
    auth:
      mode: key_authorization
      access_key:
        derive: per_tx
        mnemonic: "test test test test test test test test test test test junk"
        range: [1000000, 1001000]
      key_type: secp256k1
      limits:
        - token: "0x20c0000000000000000000000000000000000000"
          amount: "1000000000000000000000000"
          period: 0
      witness:
        random_bytes: 32
    from:
      pool: users
      select: random
    gas_limit: 400000
    fee_token: "0x20c0000000000000000000000000000000000000"
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    call:
      to: "0x20c0000000000000000000000000000000000000"
      abi: ERC20
      function: transfer
      args:
        - pool:
            pool: users
            select: random
        - 1

mix:
  - template: inline_key_authorization_tip20_transfer
    weight: 100
