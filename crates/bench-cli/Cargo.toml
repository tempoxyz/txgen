[package]
name = "bench-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
# workspace
bench-core.workspace = true

# CLI
clap.workspace = true

# serde
serde.workspace = true
serde_json.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-provider = { workspace = true, features = ["hyper", "txpool-api"] }
alloy-rpc-client = "2"
alloy-rlp.workspace = true
alloy-rpc-types-engine = { version = "2", features = ["jwt"] }
alloy-transport = "2"
alloy-transport-http = { version = "2", features = ["jwt-auth", "hyper"] }

# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-std"] }

# misc
eyre.workspace = true
humantime = "2"
reqwest = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
