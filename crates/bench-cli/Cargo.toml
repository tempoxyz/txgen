[package]
name = "bench-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
# workspace
bench-core.workspace = true

# CLI
clap.workspace = true

# serde
serde.workspace = true
serde_json.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-network.workspace = true
alloy-provider = { version = "1", features = ["hyper", "txpool-api"] }
alloy-rpc-client = "1"
alloy-rpc-types-engine = { version = "1", features = ["jwt"] }
alloy-transport = "1"
alloy-transport-http = { version = "1", features = ["jwt-auth", "hyper"] }

# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-std"] }

# misc
eyre.workspace = true
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

