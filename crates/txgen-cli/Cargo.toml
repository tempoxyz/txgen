[package]
name = "txgen-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "txgen"
path = "src/main.rs"

[dependencies]
# workspace
txgen-core.workspace = true
txgen-ethereum.workspace = true
txgen-tempo.workspace = true

# CLI
clap = { version = "4", features = ["derive"] }

# serde
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# misc
rand.workspace = true
eyre.workspace = true

# RPC client for nonce fetching
alloy-provider.workspace = true
alloy-primitives.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "rt", "time"] }
