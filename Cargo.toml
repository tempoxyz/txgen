[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# workspace
bench-core = { path = "crates/bench-core" }
txgen-core = { path = "crates/txgen-core" }
txgen-ethereum = { path = "crates/txgen-ethereum" }
txgen-tempo = { path = "crates/txgen-tempo" }
txgen-cli = { path = "crates/txgen-cli" }

# CLI
clap = { version = "4", features = ["derive"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# alloy
alloy-primitives = { version = "1", features = ["rand", "serde"] }
alloy-sol-types = "1"
alloy-dyn-abi = { version = "1", features = ["eip712"] }
alloy-json-abi = "1"
alloy-signer = "1"
alloy-signer-local = "1"
alloy-consensus = "1"
alloy-network = "1"
alloy-provider = { version = "1", features = ["debug-api", "engine-api"] }
alloy-rpc-types-eth = "1"
alloy-eips = "1"
alloy-rlp = "0.3"

# tempo
tempo-alloy = "1"
tempo-primitives = "1"

# misc
hex = "0.4"
rand = "0.9"
eyre = "0.6"
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v4", "serde"] }
